services:

  master:
    build: .
    image: apache/hadoop:3.5.0
    container_name: hadoop-master
    hostname: master
    user: root

    environment:
      HDFS_NAMENODE_USER: root
      HDFS_SECONDARYNAMENODE_USER: root
      YARN_RESOURCEMANAGER_USER: root

    command: >
      bash -c "
        mkdir -p /tmp/hadoop-root/dfs/name &&
        if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then
          hdfs namenode -format -force;
        fi &&
        hdfs namenode &
        yarn resourcemanager &
        tail -f /dev/null
      "

    ports:
      - "9870:9870"
      - "8020:8020"
      - "8088:8088"
      - "8030:8030"
      - "8031:8031"
      - "8032:8032"

    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

    networks:
      - hadoop


  worker:
    build: .
    image: apache/hadoop:3.5.0
    container_name: hadoop-worker
    hostname: worker
    user: root

    environment:
      HDFS_DATANODE_USER: root
      YARN_NODEMANAGER_USER: root

    command: >
      bash -c "
        mkdir -p /tmp/hadoop-root/dfs/data &&
        chmod 755 /tmp/hadoop-root/dfs/data &&
        hdfs datanode &
        yarn nodemanager &
        tail -f /dev/null
      "

    ports:
      - "9864:9864"
      - "9866:9866"
      - "9867:9867"
      - "8042:8042"

    volumes:
      - worker_data:/tmp/hadoop-root/dfs/data
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

    networks:
      - hadoop


volumes:
  namenode_data:
  worker_data:


networks:
  hadoop:
    driver: bridge